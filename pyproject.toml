[project]
name = "cvs2sqlanalyst"
version = "0.1.0"
description = "Turn CSV files into SQL explorations and interactive charts"
requires-python = ">=3.11"
dependencies = [
 "duckdb>=1.4,<2",
 "pandas>=2.2,<4",
 "plotly>=6,<7",
 "streamlit>=1.66,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
